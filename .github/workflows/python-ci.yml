name: "Python Backend CI"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: "FastAPI Quality, Type & Test Checks"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.txt
      - name: Install locked runtime and pinned development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt -r requirements-dev.txt
          python -m pip check
      - name: Audit locked runtime dependencies
        run: pip-audit -r requirements.lock.txt --no-deps --disable-pip
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy main.py
      - name: Python syntax check
        run: python -m py_compile main.py
      - name: FastAPI app import smoke test
        run: python -c "from main import app; print('App initialized successfully:', app.title)"
        env:
          OPENAI_API_KEY: "mock-key-for-ci"
          ENDPOINT_API_KEY: "ci-endpoint-key"
      - name: Unit tests
        run: pytest -q
        env:
          OPENAI_API_KEY: "mock-key-for-ci"
          ENDPOINT_API_KEY: "ci-endpoint-key"

  required-ci:
    name: required-ci
    if: always()
    needs: [python-quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce mandatory Python checks
        env:
          PYTHON_QUALITY_RESULT: ${{ needs.python-quality.result }}
        run: |
          {
            echo "## Required CI"
            echo
            echo "| Mandatory workflow | Result |"
            echo "|---|---|"
            echo "| Python Quality, Type & Tests | $PYTHON_QUALITY_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PYTHON_QUALITY_RESULT" != "success" ]]; then
            echo "::error::Required CI is blocked: Python quality checks failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "All mandatory Python checks passed."
