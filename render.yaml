services:
  - type: web
    name: bizsproutai-backend
    runtime: python
    buildCommand: pip install -r requirements.lock.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: REQUIRE_ENDPOINT_AUTH
        value: "true"
      - key: ENDPOINT_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
