services:
  - type: web
    name: bizsproutai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: BRAIN_API_TOKEN
        sync: false
      - key: BRAIN_REQUEST_SIGNING_KEY
        sync: false
      - key: PAYLOAD_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://bizsproutai.com,https://www.bizsproutai.com"
      - key: TRUST_PROXY_HEADERS
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"
